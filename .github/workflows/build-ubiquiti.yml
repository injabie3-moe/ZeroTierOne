name: Cross-compile ZeroTier for Ubiquiti (arm64)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build ZeroTier for arm64
    runs-on: ubuntu-latest

    env:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      ZT_UBIQUITI: '1'

    steps:
      - name: 🛠 Checkout source
        uses: actions/checkout@v3

      - name: 📦 Install cross-compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            make

      - name: 🔧 Patch make-linux.mk to disable SSO
        run: |
          sed -i 's/^\(.*ZT_SSO_SUPPORTED=\)1/\10/' make-linux.mk

      - name: 🧱 Build ZeroTier
        run: |
          make -f Makefile CC=${CC} CXX=${CXX} ZT_UBIQUITI=${ZT_UBIQUITI}

      - name: 🧪 Verify binary architecture
        run: file zerotier-one

      - name: 🏷 Set metadata for artifact
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-arm64-${{ steps.vars.outputs.date_tag }}-${{ steps.vars.outputs.short_sha }}
          path: zerotier-one

