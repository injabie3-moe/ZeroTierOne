name: Cross-compile ZeroTier for Ubiquiti (arm64)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build and package ZeroTier (arm64)
    runs-on: ubuntu-latest

    env:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
      ZT_UBIQUITI: '1'

    steps:
      - name: 🛠 Checkout source
        uses: actions/checkout@v3

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            make \
            dpkg-dev fakeroot \
            devscripts build-essential lintian debhelper

      - name: 🔧 Patch make-linux.mk to disable SSO
        run: |
          sed -i 's/^\(.*ZT_SSO_SUPPORTED=\)1/\10/' make-linux.mk

      - name: 🧱 Build and package (.deb) using Makefile
        run: |
          make CC=${CC} CXX=${CXX} ZT_UBIQUITI=${ZT_UBIQUITI}
          make debian CC=${CC} CXX=${CXX} ZT_UBIQUITI=${ZT_UBIQUITI}

      - name: 🏷 Set metadata for artifact
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-arm64-deb-${{ steps.vars.outputs.date_tag }}-${{ steps.vars.outputs.short_sha }}
          path: '*.deb'

